name: track-freshness
  on:
    schedule:
      - cron: "17 7 * * *"
    workflow_dispatch:
  permissions:
    contents: read
  jobs:
    check:
      runs-on: ubuntu-latest
      steps:
        - name: check track freshness
          env:
            GH_TOKEN: ${{ github.token }}
          run: |
            last=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq '.commit.committer.date')
            age_h=$(( ( $(date -u +%s) - $(date -d "$last" +%s) ) / 3600 ))
            echo "last commit: ${age_h}h ago ($last)"
            if [ "$age_h" -gt -1 ]; then
              echo "::error::track stale ${age_h}h — VPS or publisher down"
              exit 1
            fi
            echo "ok, fresh"
