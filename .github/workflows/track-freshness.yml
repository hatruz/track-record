name: track-freshness

  on:
    schedule:
      - cron: '17 7 * * *'
    workflow_dispatch: {}

  permissions:
    contents: read

  jobs:
    check:
      runs-on: ubuntu-latest
      steps:
        - name: Свежесть последнего коммита трека
          env:
            GH_TOKEN: ${{ github.token }}
          run: |
            last=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq '.commit.committer.date')
            last_s=$(date -d "$last" +%s)
            now=$(date -u +%s)
            age_h=$(( (now - last_s) / 3600 ))
            echo "Последний коммит трека: ${age_h} ч назад ($last)"
            if [ "$age_h" -gt -1 ]; then
              echo "::error title=Трек протух::${age_h} ч без публикации — VPS или публикатор встали. Проверь бота."
              exit 1
            fi
            echo "Порядок: трек свежий."
