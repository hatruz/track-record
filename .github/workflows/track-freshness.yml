# Backstop «обе машины мертвы» — рубеж 3 сторожа автономности.
#
# Кладётся в ПУБЛИЧНЫЙ репозиторий hatruz/track-record как
#   .github/workflows/track-freshness.yml
#
# Логика: VPS публикует трек туда каждый день в 03:00 МСК. `index.html` меняется
# ежедневно даже без новых торговых данных → коммит есть КАЖДЫЙ день, включая
# выходные (проверено 30.08.2026: `трек на 28/29/30.08` подряд). Экшн раз в сутки
# проверяет, что последний коммит не старше порога; иначе падает, и GitHub шлёт
# владельцу репозитория письмо о провале workflow. Ноль новых сервисов и аккаунтов.
#
# Это ТРЕТИЙ рубеж и единственный с покрытием 7 дней в неделю: рубеж 1 (VPS сам о
# себе) и рубеж 2 (ala следит за VPS) по выходным молчат — ala спит, а её порог
# по будничному планировщику Mon..Fri. Этот рубеж закрывает субботу-воскресенье.
#
# Порог 44 ч (было 80): раз коммит ежедневный, 44 ч = пропущено ~1.5 суток
# публикации. Запас — на прыжки расписания GitHub Actions (наблюдалось +14 ч
# 28.08.2026). Тайт­нее ~40 ч делать нельзя: два подряд просроченных cron-прогона
# GitHub → ложная тревога.
#
# Само-тест письма: Actions → track-freshness → Run workflow →
#   simulate_stale_hours = 200   (искусственно состарит коммит, workflow упадёт,
#   должно прийти письмо). Вернуть 0 / просто не трогать.

name: track-freshness

on:
  schedule:
    - cron: '17 7 * * *'   # ~10:17 МСК, заведомо после публикации в 03:00 МСК
  workflow_dispatch:
    inputs:
      simulate_stale_hours:
        description: 'Само-тест: искусственно состарить коммит на N часов, чтобы проверить письмо. 0 = обычная проверка.'
        required: false
        default: '0'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Свежесть последнего коммита
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date -u +%s)
          sim="${{ github.event.inputs.simulate_stale_hours || '0' }}"
          sim="${sim//[^0-9]/}"; sim="${sim:-0}"
          age_h=$(( (now - last) / 3600 + sim ))
          echo "Последний коммит трека: ${age_h} ч назад (симуляция +${sim}ч) ($(git log -1 --format='%h %ci %s'))"
          if [ "$age_h" -gt 44 ]; then
            echo "::error title=Трек протух::${age_h} ч без публикации — VPS или публикатор встали. Проверь бота."
            exit 1
          fi
          echo "Порядок: трек свежий."
